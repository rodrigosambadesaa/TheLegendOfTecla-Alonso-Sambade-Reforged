name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Protect both Maven/Java test jobs and GUI Docker smoke tests against CVE-2026-114938.
env:
  JAVA_TOOL_OPTIONS: -XX:-UseBASE64Intrinsics

jobs:
  upstream-parity:
    name: Compare source against original Tecla
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout this variant
        uses: actions/checkout@v7

      - name: Checkout original Tecla as parity reference
        uses: actions/checkout@v7
        with:
          repository: rodrigosambadesaa/TheLegendOfTecla
          ref: main
          path: .upstream-original
          persist-credentials: false

      - name: Check common sources, resources and allowed variant classes
        run: python3 tools/check_upstream_parity.py --variant alonso --upstream .upstream-original

  upstream-regressions:
    name: Run original regression tests missing from this edition
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout this Reforged edition
        uses: actions/checkout@v7

      - name: Checkout original regression test reference
        uses: actions/checkout@v7
        with:
          repository: rodrigosambadesaa/TheLegendOfTecla
          ref: main
          path: .upstream-original
          persist-credentials: false

      - name: Set up Java 17 and Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Add missing original regression suites without overwriting edition tests
        shell: bash
        run: |
          python3 - <<'PY'
          import shutil
          from pathlib import Path

          source = Path(".upstream-original/src/test")
          destination = Path("src/test")
          if not source.is_dir():
              raise SystemExit("Missing original regression tests")
          added = 0
          for file in sorted(source.rglob("*")):
              if not file.is_file():
                  continue
              target = destination / file.relative_to(source)
              if target.exists():
                  continue
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(file, target)
              added += 1
          print(f"Added {added} original regression files (existing Reforged tests retained)")
          PY

      - name: Run original and edition-specific regression suites together
        run: mvn --batch-mode --no-transfer-progress clean test

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17 and Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify Java4Shell JVM mitigation
        run: |
          set -euo pipefail
          java -XX:+PrintFlagsFinal -version 2>&1 | grep -E 'UseBASE64Intrinsics[[:space:]]+=[[:space:]]+false'

      - name: Validate Docker Compose and GUI entrypoint syntax
        run: |
          docker compose config --quiet
          sh -n docker/gui-entrypoint.sh
          TECLA_GUI_ENABLE_DEBUG=true docker compose config --quiet

      - name: Compile, test, analyze, package and generate Javadoc
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Show coverage summary
        if: always()
        run: |
          if [[ -f target/site/jacoco/jacoco.csv ]]; then
            awk -F, 'NR > 1 { missed += $8; covered += $9 }
              END { total=missed+covered; if (total) printf "Line coverage: %.2f%% (%d/%d)\n", 100*covered/total, covered, total }' \
              target/site/jacoco/jacoco.csv
          fi

      - name: Upload executable JAR
        uses: actions/upload-artifact@v7
        with:
          name: executable-jar
          path: target/the-legend-of-tecla.jar
          if-no-files-found: error

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@v7
        with:
          name: cyclonedx-sbom
          path: target/bom.json
          if-no-files-found: error

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: error

      - name: Upload Javadoc
        uses: actions/upload-artifact@v7
        with:
          name: javadoc
          path: target/reports/apidocs/
          if-no-files-found: error

      - name: Upload GUI smoke captures
        uses: actions/upload-artifact@v7
        with:
          name: gui-smoke-captures
          path: target/gui-smoke/*.png
          if-no-files-found: ignore

  gui-container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build GUI container
        run: docker compose build gui

      - name: Verify Java4Shell GUI JVM mitigation
        run: |
          set -euo pipefail
          docker compose run --rm --entrypoint java gui -XX:+PrintFlagsFinal -version 2>&1 \
            | grep -E 'UseBASE64Intrinsics[[:space:]]+=[[:space:]]+false'

      - name: Start GUI without remote debugger
        run: docker compose up -d gui

      - name: Assert noVNC readiness and JDWP disabled by default
        run: |
          python3 - <<'PY'
          import socket
          import time
          import urllib.request

          url = "http://127.0.0.1:6080/vnc.html"
          deadline = time.monotonic() + 180
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen(url, timeout=3) as response:
                      if response.status == 200:
                          break
              except (OSError, TimeoutError):
                  time.sleep(2)
          else:
              raise AssertionError("noVNC did not become ready within 180 seconds")

          try:
              with socket.create_connection(("127.0.0.1", 5005), timeout=3) as client:
                  client.settimeout(3)
                  client.sendall(b"JDWP-Handshake")
                  if client.recv(14) == b"JDWP-Handshake":
                      raise AssertionError("JDWP unexpectedly enabled by default")
          except (ConnectionError, TimeoutError, OSError):
              pass
          print("GUI responds; JDWP is disabled by default")
          PY

      - name: Restart GUI with explicit opt-in debugger
        run: TECLA_GUI_ENABLE_DEBUG=true docker compose up -d --force-recreate gui

      - name: Assert JDWP handshake when explicitly enabled
        run: |
          python3 - <<'PY'
          import socket
          import time

          deadline = time.monotonic() + 90
          while time.monotonic() < deadline:
              try:
                  with socket.create_connection(("127.0.0.1", 5005), timeout=3) as client:
                      client.settimeout(3)
                      client.sendall(b"JDWP-Handshake")
                      if client.recv(14) == b"JDWP-Handshake":
                          print("JDWP handshake completed with opt-in enabled")
                          break
              except (ConnectionError, TimeoutError, OSError):
                  time.sleep(2)
          else:
              raise AssertionError("JDWP opt-in was not reachable")
          PY

      - name: Collect logs on failure
        if: failure()
        run: docker compose ps && docker compose logs --tail=150 gui

      - name: Stop GUI container
        if: always()
        run: docker compose down --remove-orphans
