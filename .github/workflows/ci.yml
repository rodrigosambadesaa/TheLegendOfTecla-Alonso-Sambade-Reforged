name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17 and Maven cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile, test, analyze, package and generate Javadoc
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Show coverage summary
        if: always()
        run: |
          if [[ -f target/site/jacoco/jacoco.csv ]]; then
            awk -F, 'NR > 1 { missed += $8; covered += $9 }
              END { total=missed+covered; if (total) printf "Line coverage: %.2f%% (%d/%d)\n", 100*covered/total, covered, total }' \
              target/site/jacoco/jacoco.csv
          fi

      - name: Upload executable JAR
        uses: actions/upload-artifact@v7
        with:
          name: executable-jar
          path: target/the-legend-of-tecla.jar
          if-no-files-found: error

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@v7
        with:
          name: cyclonedx-sbom
          path: target/bom.json
          if-no-files-found: error

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: error

      - name: Upload Javadoc
        uses: actions/upload-artifact@v7
        with:
          name: javadoc
          path: target/reports/apidocs/
          if-no-files-found: error

      - name: Upload GUI smoke captures
        uses: actions/upload-artifact@v7
        with:
          name: gui-smoke-captures
          path: target/gui-smoke/*.png
          if-no-files-found: ignore

